name: CI SonarQube

on:
  push:
    branches: [main]
    paths:
      - "python/src/**"
      - "python/tests/**"
      - "julia/src/**"
      - "julia/test/**"
      - "rust/src/**"
      - "rust/tests/**"
      - "rust/benches/**"
      - "cpp/include/**"
      - "cpp/tests/**"
      - "cpp/benchmarks/**"
      - "r/R/**"
      - "r/tests/**"
      - "sonar-project.properties"
      - ".github/workflows/ci-sonarqube.yml"
  pull_request:
    paths:
      - "python/src/**"
      - "python/tests/**"
      - "julia/src/**"
      - "julia/test/**"
      - "rust/src/**"
      - "rust/tests/**"
      - "rust/benches/**"
      - "cpp/include/**"
      - "cpp/tests/**"
      - "cpp/benchmarks/**"
      - "r/R/**"
      - "r/tests/**"
      - "sonar-project.properties"
      - ".github/workflows/ci-sonarqube.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  POETRY_VIRTUALENVS_CREATE: "false"

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube monorepo scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: preflight
        name: Check SonarQube configuration
        env:
          SONAR_TOKEN: ${{ secrets['SONAR_TOKEN'] }}
          SONAR_HOST_URL: ${{ secrets['SONAR_HOST_URL'] }}
        run: |
          if [ -z "${SONAR_TOKEN}" ] || [ -z "${SONAR_HOST_URL}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configuration hint
        if: steps.preflight.outputs.missing == 'true'
        run: |
          echo "Skipping SonarQube scan because required secrets are missing."
          echo "Set SONAR_TOKEN and SONAR_HOST_URL in repository secrets to enable CI SonarQube analysis."

      - name: Set up Python 3.13
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup Poetry
        if: steps.preflight.outputs.enabled == 'true'
        uses: ./.github/actions/setup-poetry

      - name: Generate Python coverage
        if: steps.preflight.outputs.enabled == 'true'
        run: |
          bash .github/scripts/poetry-install.sh --no-root --only main,dev,benchmarks
          bash .github/scripts/install-package-editable.sh
          poetry -C python run pytest --cov=givp --cov-report=xml:../coverage-python.xml tests/

      - name: Set up Rust toolchain
        if: steps.preflight.outputs.enabled == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        if: steps.preflight.outputs.enabled == 'true'
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          tool: cargo-llvm-cov

      - name: Generate Rust coverage
        if: steps.preflight.outputs.enabled == 'true'
        working-directory: rust
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Prepare C++ compile database
        if: steps.preflight.outputs.enabled == 'true'
        run: |
          cmake -S cpp -B cpp/build/sonar \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DGIVP_BUILD_TESTS=OFF \
            -DGIVP_BUILD_BENCHMARKS=OFF \
            -DGIVP_BUILD_FUZZ=OFF \
            -DGIVP_BUILD_SONAR_TU=ON
          # Remove FetchContent (_deps) compilation units from the database.
          # They are not indexed by Sonar (not in sonar.sources/sonar.tests)
          # and would cause CFamily to abort with "0 files analyzed".
          jq '[.[] | select(.file | contains("/_deps/") | not)]' \
            cpp/build/sonar/compile_commands.json > /tmp/cc_filtered.json
          mv /tmp/cc_filtered.json cpp/build/sonar/compile_commands.json

      - name: Remove compiled Python artefacts before scan
        if: steps.preflight.outputs.enabled == 'true'
        run: find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true

      - name: SonarQube scan
        if: steps.preflight.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets['SONAR_TOKEN'] }}
          SONAR_HOST_URL: ${{ secrets['SONAR_HOST_URL'] }}
        with:
          args: >
            -Dsonar.projectKey=Arnime_grasp_ils_vnd_pr
            -Dsonar.projectName=givp -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
