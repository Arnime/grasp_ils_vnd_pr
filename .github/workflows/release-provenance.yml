name: Release Provenance and Assets

on:
  workflow_call:
    inputs:
      tag:
        description: "Validated release tag"
        required: true
        type: string
      python_hashes:
        required: true
        type: string
      cpp_hashes:
        required: true
        type: string
      r_hashes:
        required: true
        type: string
      python_artifact_name:
        required: true
        type: string
      cpp_artifact_name:
        required: true
        type: string
      r_artifact_name:
        required: true
        type: string

permissions:
  contents: read

jobs:
  combine:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.subjects.outputs.hashes }}
    steps:
      - id: subjects
        env:
          CPP_HASHES: ${{ inputs.cpp_hashes }}
          PYTHON_HASHES: ${{ inputs.python_hashes }}
          R_HASHES: ${{ inputs.r_hashes }}
        shell: bash
        run: |
          set -euo pipefail
          for value in "$PYTHON_HASHES" "$CPP_HASHES" "$R_HASHES"; do
            if [ -z "$value" ]; then
              echo "::error::A required release hash output is empty."
              exit 1
            fi
          done
          {
            printf '%s' "$PYTHON_HASHES" | base64 --decode
            printf '%s' "$CPP_HASHES" | base64 --decode
            printf '%s' "$R_HASHES" | base64 --decode
          } | base64 -w0 | xargs -I{} echo "hashes={}" >> "$GITHUB_OUTPUT"

  provenance:
    needs: combine
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: "${{ needs.combine.outputs.hashes }}"
      compile-generator: true
      upload-assets: true
      upload-tag-name: ${{ inputs.tag }}

  attach:
    needs: provenance
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify required SLSA provenance
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name' \
            | grep -Eq '\.intoto\.jsonl$'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.python_artifact_name }}
          path: python-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.cpp_artifact_name }}
          path: cpp-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.r_artifact_name }}
          path: r-assets
      - name: Attach all signed release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            python-assets/**
            cpp-assets/**
            r-assets/**
