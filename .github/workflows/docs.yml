name: Docs

on:
    push:
        branches: [main]
        paths:
            - "docs/**"
            - "mkdocs.yml"
            - "python/src/**"
            - "python/pyproject.toml"
            - "python/poetry.lock"
            - ".github/workflows/docs.yml"
    pull_request:
    workflow_dispatch:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    POETRY_VIRTUALENVS_CREATE: "false"

permissions:
    contents: read

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.13"
            - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
              with:
                  enablement: true
            - name: Setup Poetry
              uses: ./.github/actions/setup-poetry
            - name: Install
              run: bash .github/scripts/poetry-install.sh --only main,docs
            - name: Build
              run: >-
                  poetry -C python run mkdocs build
                  -f "$GITHUB_WORKSPACE/mkdocs.yml"
                  --strict
                  --site-dir "$GITHUB_WORKSPACE/_site"
            - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v4.0.0
              with:
                  path: _site

    deploy:
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
