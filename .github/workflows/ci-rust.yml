name: CI Rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      toolchains: ${{ steps.pick.outputs.toolchains }}
      source_changed: ${{ steps.pick.outputs.source_changed }}
      config_changed: ${{ steps.pick.outputs.config_changed }}
      validation_required: ${{ steps.pick.outputs.validation_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            source_changed=false
            config_changed=false
            if git diff --name-only "$PR_BASE" HEAD -- rust/src rust/tests rust/benches | grep -q .; then
              echo 'toolchains=["stable","1.85","beta"]' >> "$GITHUB_OUTPUT"
              source_changed=true
            else
              echo 'toolchains=["stable"]' >> "$GITHUB_OUTPUT"
            fi
            if git diff --name-only "$PR_BASE" HEAD -- rust/Cargo.toml rust/Cargo.lock .github/actions/setup-rust .github/workflows/ci-rust.yml codecov.yml | grep -q .; then
              config_changed=true
            fi
            echo "source_changed=$source_changed" >> "$GITHUB_OUTPUT"
            echo "config_changed=$config_changed" >> "$GITHUB_OUTPUT"
            if [[ "$source_changed" == true || "$config_changed" == true ]]; then
              echo 'validation_required=true' >> "$GITHUB_OUTPUT"
            else
              echo 'validation_required=false' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'toolchains=["stable","1.85","beta"]' >> "$GITHUB_OUTPUT"
            echo 'source_changed=true' >> "$GITHUB_OUTPUT"
            echo 'config_changed=true' >> "$GITHUB_OUTPUT"
            echo 'validation_required=true' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: setup
    if: github.event_name != 'pull_request' || needs.setup.outputs.validation_required == 'true'
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.rust == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: ${{ fromJson(needs.setup.outputs.toolchains) }}
        exclude:
          - rust: beta
            os: windows-latest
          - rust: beta
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ matrix.rust }}

      - name: Resolve Cargo binary (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TOOLCHAIN: ${{ matrix.rust }}
        run: |
          cargo_bin="$(compgen -G "$HOME/.rustup/toolchains/${TOOLCHAIN}-*/bin/cargo" | head -n 1)"
          if [ -z "$cargo_bin" ]; then
            echo "::error::Unable to locate cargo binary for toolchain ${TOOLCHAIN}"
            exit 1
          fi
          echo "CARGO_BIN=$cargo_bin" >> "$GITHUB_ENV"
          echo "Using cargo at: $cargo_bin"
          "$cargo_bin" --version

      - name: Resolve Cargo binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TOOLCHAIN: ${{ matrix.rust }}
        run: |
          $toolchain = Get-ChildItem "$env:USERPROFILE\.rustup\toolchains" -Directory |
            Where-Object { $_.Name -like "$env:TOOLCHAIN-*" } |
            Select-Object -First 1
          if (-not $toolchain) {
            Write-Error "Unable to locate cargo binary for toolchain $env:TOOLCHAIN"
            exit 1
          }
          $cargoBin = Join-Path $toolchain.FullName "bin\cargo.exe"
          if (-not (Test-Path $cargoBin)) {
            Write-Error "Cargo executable not found at $cargoBin"
            exit 1
          }
          "CARGO_BIN=$cargoBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using cargo at: $cargoBin"
          & "$cargoBin" --version


      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: rust
        run: |
          TOOLCHAIN_BIN="$(dirname "$CARGO_BIN")"
          PATH="$TOOLCHAIN_BIN:$PATH" "$CARGO_BIN" build --locked --verbose

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: rust
        run: |
          $toolchainBin = Split-Path $env:CARGO_BIN -Parent
          $env:Path = "$toolchainBin;$env:Path"
          & "$env:CARGO_BIN" build --locked --verbose

      - name: Run tests (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: rust
        run: |
          TOOLCHAIN_BIN="$(dirname "$CARGO_BIN")"
          PATH="$TOOLCHAIN_BIN:$PATH" "$CARGO_BIN" test --locked --verbose

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: rust
        run: |
          $toolchainBin = Split-Path $env:CARGO_BIN -Parent
          $env:Path = "$toolchainBin;$env:Path"
          & "$env:CARGO_BIN" test --locked --verbose

  clippy:
    needs: setup
    if: github.event_name != 'pull_request' || needs.setup.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: clippy

      - name: Clippy
        working-directory: rust
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  fmt:
    needs: setup
    if: github.event_name != 'pull_request' || needs.setup.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: rustfmt

      - name: rustfmt
        working-directory: rust
        run: cargo fmt --all -- --check

  coverage:
    needs: setup
    if: github.event_name != 'pull_request' || needs.setup.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: llvm-tools-preview


      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage
        working-directory: rust
        run: cargo llvm-cov --locked --all-features --lcov --output-path lcov.info

      - name: Check coverage gate (≥90%)
        working-directory: rust
        run: |
          hit=$(grep '^LH:' lcov.info | awk -F: '{s+=$2} END {print s+0}')
          total=$(grep '^LF:' lcov.info | awk -F: '{s+=$2} END {print s+0}')
          if [ "$total" -eq 0 ]; then
            echo "::error::No coverage data found in lcov.info"
            exit 1
          fi
          pct=$(awk "BEGIN {printf \"%.1f\", $hit / $total * 100}")
          echo "Rust coverage: ${pct}%  ($hit / $total lines)"
          awk "BEGIN { if ($hit / $total * 100 < 90.0) { print \"::error::Coverage below 90% threshold (got ${pct}%)\"; exit 1 } }"

      - name: Check patch coverage on PR (>= 90%)
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          CHANGED_FILE="$(mktemp)"

          git diff --unified=0 "$BASE_SHA...HEAD" -- rust/src | awk '
            /^\+\+\+ b\// {f=substr($0,7); next}
            /^@@ / {
              if (f == "") next
              if (match($0, /\+([0-9]+)(,([0-9]+))?/, a)) {
                s = a[1] + 0
                n = (a[3] == "" ? 1 : a[3] + 0)
                for (i = 0; i < n; i++) print f ":" (s + i)
              }
            }
          ' | sort -u > "$CHANGED_FILE"

          if [ ! -s "$CHANGED_FILE" ]; then
            echo "Rust patch coverage: N/A (no changed lines in rust/src)"
            exit 0
          fi

          awk -v changed_file="$CHANGED_FILE" -v threshold="90.0" '
            BEGIN {
              while ((getline l < changed_file) > 0) {
                changed[l] = 1
                total++
              }
              close(changed_file)
            }
            /^SF:/ {
              file = substr($0, 4)
              sub(/^.*\/givp\//, "", file)
              sub(/^\.\//, "", file)
              next
            }
            /^DA:/ {
              split(substr($0, 4), a, ",")
              key = file ":" a[1]
              if (key in changed) {
                seen[key] = 1
                if ((a[2] + 0) > 0) covered++
              }
            }
            END {
              coverable = 0
              for (k in changed) if (k in seen) coverable++
              if (coverable == 0) {
                print "Rust patch coverage: N/A (no coverable changed lines in rust/src)"
                exit 0
              }
              missing = total - coverable
              pct = (covered / coverable) * 100.0
              printf("Rust patch coverage: %.1f%%  (%d / %d coverable changed lines)\n", pct, covered, coverable)
              if (missing > 0) {
                printf("::warning::%d changed lines are non-coverable in lcov and were excluded\n", missing)
              }
              if (pct + 1e-9 < threshold) {
                printf("::error::Rust patch coverage below %.1f%% threshold (got %.1f%%)\n", threshold, pct)
                exit 1
              }
            }
          ' rust/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: rust/lcov.info
          flags: rust
          fail_ci_if_error: true

  coverage-gate:
    name: coverage-rust
    needs: [setup, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report Rust coverage status
        env:
          SETUP_RESULT: ${{ needs.setup.result }}
          SOURCE_CHANGED: ${{ needs.setup.outputs.source_changed }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          if [ "$SETUP_RESULT" != success ]; then
            echo "::error::Rust change detection did not complete successfully."
            exit 1
          fi
          if [ "$SOURCE_CHANGED" != true ]; then
            echo "Rust coverage is not applicable: no Rust source or test changes."
            exit 0
          fi
          if [ "$COVERAGE_RESULT" != success ]; then
            echo "::error::Rust coverage job finished with '$COVERAGE_RESULT'."
            exit 1
          fi
          echo "Rust coverage passed."

  benchmarks:
    needs: setup
    if: github.event_name != 'pull_request' || needs.setup.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.13"

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable


      - name: Run benchmarks (smoke test)
        working-directory: rust
        run: cargo bench --locked -- --test

      - name: Run literature comparison smoke test
        working-directory: rust
        run: |
          cargo run --locked --bin run_literature_comparison -- \
            --n-runs 2 \
            --dims 3 \
            --max-iter 10 \
            --time-limit 2 \
            --algorithms GIVP-full DE PSO GA CMA-ES SA \
            --output benchmarks/ci_smoke_results.json

      - name: Setup Poetry
        uses: ./.github/actions/setup-poetry

      - name: Install Python report dependencies
        run: bash .github/scripts/poetry-install.sh --no-root --only main,benchmarks

      - name: Generate canonical benchmark smoke report
        run: |
          poetry -C python run python -m benchmarks.reporting \
            --input ../rust/benchmarks/ci_smoke_results.json \
            --format markdown \
            --no-plots \
            --output-dir ../rust/benchmarks
